name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Dashboard (served at the domain root) ----
      - name: Install dashboard deps
        run: npm ci
        working-directory: apps/dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: apps/dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OVERLAY_BASE_URL: https://sidekik.dpdns.org/live/

      # ---- Overlay (served at /live/) ----
      - name: Install overlay deps
        run: npm ci
        working-directory: apps/overlay

      - name: Build overlay
        run: npm run build
        working-directory: apps/overlay
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ---- Combine both builds into one site ----
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/dashboard/dist/. site/
          mkdir -p site/live
          cp -r apps/overlay/dist/. site/live/
          echo "sidekik.dpdns.org" > site/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
