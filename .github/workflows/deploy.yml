name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Dashboard (served at the domain root) ----
      - name: Install dashboard deps
        run: npm ci
        working-directory: apps/dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: apps/dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OVERLAY_BASE_URL: https://sidekik.dpdns.org/live/

      # ---- Overlay (served at /live/) ----
      - name: Install overlay deps
        run: npm ci
        working-directory: apps/overlay

      - name: Build overlay
        run: npm run build
        working-directory: apps/overlay
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ---- Combine both builds into one site ----
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/dashboard/dist/. site/
          mkdir -p site/live
          cp -r apps/overlay/dist/. site/live/

      # ---- Push the built site straight to the gh-pages branch ----
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: sidekik.dpdns.org
