<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sidekick Overlay</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      body {
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      .alert-banner {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffc700;
        color: #14141a;
        border: 3px solid #14141a;
        border-radius: 12px;
        padding: 1rem 2rem;
        font-weight: 700;
        font-size: 1.3rem;
        box-shadow: 6px 6px 0 #14141a;
        animation: alert-pop 0.25s ease-out;
      }
      @keyframes alert-pop {
        from { transform: translateX(-50%) scale(0.8); opacity: 0; }
        to { transform: translateX(-50%) scale(1); opacity: 1; }
      }
    </style>
    <script type="module" crossorigin src="/live/assets/index-Dfa7Fuii.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
